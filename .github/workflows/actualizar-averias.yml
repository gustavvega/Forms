name: Actualizar datos de averías

on:
  repository_dispatch:
    types: [actualizar-averias, actualizar-averia, actualizar-lote-averias, actualizar-equipos-intervenciones]

permissions:
  contents: write

jobs:
  actualizar-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Actualizar JSON y publicar si hay cambios
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for intento in 1 2 3 4 5; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard FETCH_HEAD

            python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = Path('averias/data')
          with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as archivo:
              evento = json.load(archivo)
          payload = evento['client_payload']

          def escribir_json(ruta, registros):
              with ruta.open('w', encoding='utf-8') as archivo:
                  json.dump(registros, archivo, ensure_ascii=False, indent=2)
                  archivo.write('\n')

          accion = evento['action']
          if accion in ('actualizar-averia', 'actualizar-lote-averias'):
              registros = ([payload.get('registro')] if accion == 'actualizar-averia'
                           else payload.get('registros'))
              if not isinstance(registros, list):
                  raise SystemExit('client_payload.registros debe ser un arreglo JSON')

              ruta = data / 'averias.json'
              with ruta.open(encoding='utf-8') as archivo:
                  averias = json.load(archivo)
              if not isinstance(averias, list):
                  raise SystemExit('averias.json debe contener un arreglo JSON')

              indices = {}
              for indice, averia in enumerate(averias):
                  indices.setdefault(averia['AV'], indice)

              hubo_cambios = False
              for registro in registros:
                  av = registro.get('AV') if isinstance(registro, dict) else None
                  if not isinstance(av, str) or not av.strip():
                      raise SystemExit('Cada registro debe ser un objeto con una AV válida')
                  if av not in indices:
                      indices[av] = len(averias)
                      averias.append(registro)
                      hubo_cambios = True
                  elif averias[indices[av]] != registro:
                      averias[indices[av]] = registro
                      hubo_cambios = True
              if hubo_cambios:
                  escribir_json(ruta, averias)
          else:
              nombres = ('equipos', 'intervenciones')
              if accion == 'actualizar-averias':
                  nombres = ('equipos', 'averias', 'intervenciones')
              for nombre in nombres:
                  if not isinstance(payload.get(nombre), list):
                      raise SystemExit(f'{nombre} debe ser un arreglo JSON en client_payload')

              data.mkdir(parents=True, exist_ok=True)
              for nombre in nombres:
                  escribir_json(data / f'{nombre}.json', payload[nombre])
          PY

            git add averias/data/equipos.json averias/data/averias.json averias/data/intervenciones.json
            if git diff --cached --quiet; then
              echo "No hay cambios"
              exit 0
            fi
            git commit -m "Actualizar datos de averías"
            if git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"; then
              exit 0
            fi

            # Si otra ejecución publicó primero, aplicar el evento sobre su versión.
            sleep "$intento"
          done

          echo "::error::No se pudieron publicar los cambios"
          exit 1
